# kucolorfulname | 作者：xiaole | Paper/Folia 26.2 | JDK 25
# YAML 只能使用空格缩进。枚举值建议保持大写。
# settings、groups、styles 可用 /kcn reload 重载；storage 修改后必须重启。

# 存储类型：SQLITE（单服）、MYSQL（MySQL 8+）、MARIADB（MariaDB 10.6+）。
# SQLite 文件：plugins/kucolorfulname/kucolorfulname.db
# MySQL/MariaDB 缺少目标数据库时会自动创建；账号需要目标库的 CREATE 权限。
storage:
  type: SQLITE

  # MySQL 8+。同一群组服应使用相同的 database 和 table-prefix。
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "kucolorfulname"
    username: "root"
    password: "change-me"

    # 表前缀只允许字母、数字和下划线，最长 32 个字符。
    table-prefix: "kucolorfulname_"

    # DISABLED、PREFERRED、REQUIRED、VERIFY_CA、VERIFY_IDENTITY
    ssl-mode: PREFERRED

    # HikariCP 连接池与超时；没有明确需求时保持默认。
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    validation-timeout-ms: 5000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    keepalive-time-ms: 30000

    # 网络读写超时（毫秒）；0 表示使用驱动默认值。
    socket-timeout-ms: 30000

    # 群组服缓存同步周期（秒）；0 表示关闭。在线玩家查询会均匀分散到整个周期。
    synchronization-interval-seconds: 60

  # MariaDB 10.6+，使用官方驱动；字段含义与 mysql 相同。
  mariadb:
    host: "127.0.0.1"
    port: 3306
    database: "kucolorfulname"
    username: "root"
    password: "change-me"
    table-prefix: "kucolorfulname_"
    # DISABLED、PREFERRED、REQUIRED、VERIFY_CA、VERIFY_IDENTITY
    ssl-mode: PREFERRED
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    validation-timeout-ms: 5000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    keepalive-time-ms: 30000
    socket-timeout-ms: 30000
    synchronization-interval-seconds: 60

# 通用设置
settings:
  # 是否同步修改 Tab 列表名。
  apply-to-tab-list: true

  # 授权过期与在线玩家权限刷新周期（秒），最小值为 5；玩家检查会均匀错开。
  # 解锁来源失效后，最迟在本周期内恢复无颜色；所选样式 key 会保留，重新解锁后自动生效。
  expiry-check-seconds: 30

  animation:
    # 动画刷新间隔。1 = 20 FPS；高人数服务器可改为 2（10 FPS）。
    # 仅在至少一名在线玩家实际装备动态颜色时运行刷新任务。
    refresh-ticks: 1

    # Folia 26.2 将同一帧的所有 Tab 名字合并为每位观察者一个包。
    nms-tab-batching: true


# 权限组
# 玩家只使用 priority 最高且有权限的权限组，不会合并多个权限组。
# permission 为空的是兜底权限组，只能配置一个；仅在没有任何带权限的权限组匹配时使用，不参与 priority 竞争。
# unlocked-styles：由该权限组配套解锁的样式 key；空列表表示不配套解锁任何颜色。
# default-style：该权限组自动装备的单个样式 key；留空表示不自动装备。
# 可用条件：当前最高权限组配套颜色 OR 样式独立权限 OR 有效限时授权。
groups:
  # 普通玩家兜底权限组。
  default:
    priority: 0
    permission: ""
    unlocked-styles: []
    default-style: ""

  # VIP：授予 kucolorfulname.group.vip，配套解锁全部 25 种纯色。
  vip:
    priority: 100
    permission: "kucolorfulname.group.vip"
    default-style: ruby
