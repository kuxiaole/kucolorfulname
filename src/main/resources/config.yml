# 颜色昵称样式
# 一级节点名是样式 key，已投入使用后不要改名，否则旧授权无法匹配。
# type：SOLID 需要 1 个颜色；GRADIENT、ANIMATED 至少需要 2 个颜色。
# ANIMATED 可用 FLOW、RAINBOW、PULSE、FLASH；animation-period-ticks 是完整循环 tick 数。
# colors 使用 "#RRGGBB"；decorations 可填 BOLD、ITALIC、UNDERLINED、
# STRIKETHROUGH、OBFUSCATED；icon 使用 Bukkit Material 名称。
# 单个样式独立权限使用 permission；替代权限使用 permissions: [权限A, 权限B]。
# permissions 中任意一个权限满足即可独立解锁；没有样式权限时仍可通过权限组配套或限时授权解锁。
# permission 与 permissions 可以同时存在，判定时会合并并去重。
# 玩家仓库只显示当前可用样式，展示顺序与此处顺序一致。
styles:
  # 纯色样式（25 种）
